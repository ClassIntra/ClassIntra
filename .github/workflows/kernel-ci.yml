# 内核体检流水线
#
# 内核与第三方开发契约使用两类独立检查：
#   1. 内核 job 只用 node: 内置模块，不安装依赖；
#   2. devkit job 仅安装固定版本 TypeScript，验证独立分发与类型消费；
#   3. UI/真机类验证（CDP 探针那 73 个脚本）不进这里：它们需要 Chromium 与
#      真实服务端数据，跑在 Actions 上既慢又假，留在本机按需执行。
#
# 这条流水线拦的是「只能靠人肉发现」的五类破坏：
#   服务端语法 / 迁移撞号 / manifest 契约 / shared↔server 错误码 / 前端内核冒烟

name: kernel-ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# 同一分支的新提交直接取消上一次，避免排队烧额度
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: 内核体检
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: 检出
        uses: actions/checkout@v4

      - name: 准备 Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 内核体检（语法 / 迁移 / 契约）
        run: node scripts/ci-check.mjs

      # 纯 Node 内置模块、不装依赖、<10s：资金完整性 / 凭据与日志 /
      # 事件可靠性 / Chrome80 与主题 / 工程质量 / 错误态
      - name: 全维度系统体检
        run: node scripts/system-audit.mjs

      - name: 第三方 SDK 运行时回归（无外部依赖）
        run: node --test client/test/daily-allowance-controller.test.mjs client/test/daily-allowance-visibility.test.mjs client/test/market-sdk-contract.test.mjs

  devkit:
    name: devkit 和 SDK 类型 / Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      matrix:
        node: ['18', '22']
    defaults:
      run:
        working-directory: devkit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: 安装 devkit 开发期编译器
        run: npm install --ignore-scripts --no-audit --no-fund --package-lock=false
      - name: 独立工作流与类型契约
        run: npm test
