packages:
  - 'server'
  - 'client'
# pnpm 10+ 使用 onlyBuiltDependencies 数组形式
# 仅列出允许在 install 时执行构建脚本的依赖
onlyBuiltDependencies:
  - '@parcel/watcher'
  - better-sqlite3
  - core-js
  - es5-ext
  - esbuild
overrides:
  form-data: ">=4.0.6"
  qs: ">=6.15.2"
  ws: ">=8.21.0"
  js-yaml: ">=4.1.2"
  follow-redirects: ">=1.15.12"
