packages:
  - 'server'
  - 'client'
# 安全补丁覆盖：强制使用无漏洞版本（解决 Dependabot/audit 上报的传递依赖漏洞）
overrides:
  form-data: ">=4.0.6"
  qs: ">=6.16.0"                 # 2026-10-25: 原 >=6.15.2 仍落在受影响区间（<=6.15.3）
  ws: ">=8.21.0"
  js-yaml: ">=5.4.1"             # 2026-10-25: 原钉死 5.2.2，仍在受影响区间（5.0.0~5.4.0）
  follow-redirects: ">=1.16.1"   # 2026-10-25: 原 >=1.15.12；跨域凭据泄漏修复在 1.16.1
  immutable: "5.1.8"
  ip-address: ">=10.7.1"         # 2026-10-25: 原 10.3.1，仍受影响（<=10.7.0）
  "@babel/core": "7.29.7"
  "@babel/preset-env": "7.29.7"
  body-parser: ">=1.20.9"        # 2026-10-25: 原 >=1.20.6；trailing bytes DoS 修复在 1.20.9
  # Express 4 的 IP 解析依赖。IP 伪造（GHSA-jqcg-44mw-7w3h）修复于 2.0.8。
  # ⚠️ 目前全仓未设置 trust proxy ⇒ req.ip 取 socket 地址，漏洞不可达。
  # 这一项是为「将来为反代开启 trust proxy」提前封堵，不是当前告警。
  proxy-addr: ">=2.0.8"
auditConfig:
  ignoreGhsas:
    # vue@2（EOL）parseHTML ReDoS（low），仅影响服务端渲染场景，升级需跨大版本到 Vue 3，暂缓
    - GHSA-5j4c-8p2g-v4jx
allowBuilds:
  '@parcel/watcher': true
  better-sqlite3: true
  core-js: true
  esbuild: true
