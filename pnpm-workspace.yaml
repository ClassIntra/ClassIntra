packages:
  - 'server'
  - 'client'
allowBuilds:
  '@parcel/watcher': set this to true or false
  better-sqlite3: set this to true or false
  core-js: set this to true or false
  esbuild: set this to true or false
# pnpm 10+ 使用 onlyBuiltDependencies 数组形式（替代旧 allowBuilds 字段）
# 仅列出允许在 install 时执行构建脚本的依赖
onlyBuiltDependencies:
  - '@parcel/watcher'
  - better-sqlite3
  - core-js
  - es5-ext
  - esbuild
overrides:
  form-data: ">=4.0.6"
  qs: ">=6.15.2"
  ws: ">=8.21.0"
  js-yaml: ">=4.1.2"
  follow-redirects: ">=1.15.12"
