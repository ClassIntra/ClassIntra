<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="theme-color" content="#007AFF">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="preload" as="image" href="/resources/public/icons/Chat.png">
  <link rel="preload" as="image" href="/resources/public/icons/Community.png">
  <link rel="preload" as="image" href="/resources/public/icons/AI-Chat.png">
  <link rel="preload" as="image" href="/resources/public/icons/Note.png">
  <link rel="preload" as="image" href="/resources/public/icons/Files.png">
  <link rel="preload" as="image" href="/resources/public/icons/Weather.png">
  <link rel="preload" as="image" href="/resources/public/icons/Music.png">
  <link rel="preload" as="image" href="/resources/public/icons/Settings.png">
  <title>ClassIntra</title>
  <style>
    /* 首屏 loading 内联样式（避免 FOUC，与 Vue 加载并行渲染） */
    #app-loading {
      position: fixed;
      top: 0;
      right: 0;
      bottom: 0;
      left: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'PingFang SC', 'Microsoft YaHei', sans-serif;
      background: radial-gradient(ellipse at top, #1a1a3e 0%, #0a0a1a 60%, #000000 100%);
      color: #fff;
      text-align: center;
      z-index: 9999;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
    #app-loading .al-inner {
      display: flex;
      flex-direction: column;
      align-items: center;
      animation: al-fade-in 0.5s ease-out;
    }
    /* Chrome 80 不支持 flex 的 gap，用 margin fallback */
    #app-loading .al-inner > * + * { margin-top: 20px; }
    @keyframes al-fade-in {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    #app-loading .al-logo {
      width: 72px;
      height: 72px;
      border-radius: 18px;
      background: linear-gradient(135deg, #007AFF 0%, #5856D6 100%);
      box-shadow: 0 12px 40px rgba(0, 122, 255, 0.4), 0 4px 12px rgba(88, 86, 214, 0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 36px;
      font-weight: 700;
      color: #fff;
      letter-spacing: -1px;
      animation: al-breathe 2.4s ease-in-out infinite;
    }
    @keyframes al-breathe {
      0%, 100% { transform: scale(1); box-shadow: 0 12px 40px rgba(0, 122, 255, 0.4), 0 4px 12px rgba(88, 86, 214, 0.3); }
      50% { transform: scale(1.04); box-shadow: 0 16px 56px rgba(0, 122, 255, 0.55), 0 6px 18px rgba(88, 86, 214, 0.45); }
    }
    #app-loading .al-title {
      font-size: 22px;
      font-weight: 600;
      letter-spacing: 1.5px;
      color: rgba(255, 255, 255, 0.95);
    }
    #app-loading .al-subtitle {
      font-size: 13px;
      color: rgba(255, 255, 255, 0.55);
      letter-spacing: 0.5px;
    }
    #app-loading .al-dots {
      display: flex;
      margin-top: 4px;
    }
    #app-loading .al-dots span + span { margin-left: 6px; }
    #app-loading .al-dots span {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.4);
      animation: al-dot-pulse 1.2s ease-in-out infinite;
    }
    #app-loading .al-dots span:nth-child(2) { animation-delay: 0.2s; }
    #app-loading .al-dots span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes al-dot-pulse {
      0%, 60%, 100% { opacity: 0.3; transform: scale(0.8); }
      30% { opacity: 1; transform: scale(1.2); background: rgba(0, 122, 255, 0.9); }
    }
    #app-loading.al-timeout .al-inner { display: none; }
    #app-loading.al-timeout .al-timeout-inner { display: flex; flex-direction: column; align-items: center; animation: al-fade-in 0.4s ease-out; }
    #app-loading .al-timeout-inner > * + * { margin-top: 16px; }
    #app-loading .al-timeout-inner { display: none; }
    #app-loading .al-timeout-title { font-size: 20px; font-weight: 600; color: rgba(255, 255, 255, 0.95); }
    #app-loading .al-timeout-msg { font-size: 13px; color: rgba(255, 255, 255, 0.55); margin-bottom: 4px; }
    #app-loading .al-reload-btn {
      padding: 10px 28px;
      border: 1px solid rgba(255, 255, 255, 0.25);
      background: rgba(255, 255, 255, 0.06);
      color: #fff;
      border-radius: 12px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 500;
      font-family: inherit;
      transition: background 0.2s ease, border-color 0.2s ease;
      -webkit-tap-highlight-color: transparent;
    }
    #app-loading .al-reload-btn:hover { background: rgba(255, 255, 255, 0.12); border-color: rgba(255, 255, 255, 0.4); }
    #app-loading .al-reload-btn:active { transform: scale(0.96); }
    @media (prefers-reduced-motion: reduce) {
      #app-loading .al-logo, #app-loading .al-dots span { animation: none !important; }
    }
  </style>
  <script>function __onVueReady(){window.__vueReady=true;var el=document.getElementById('app-loading');if(el){el.style.opacity='0';el.style.transition='opacity 0.3s ease';setTimeout(function(){el.style.display='none';},300);}}setTimeout(function(){if(!window.__vueReady){var el=document.getElementById('app-loading');if(el&&!el.classList.contains('al-timeout')){el.classList.add('al-timeout');el.innerHTML='<div class="al-timeout-inner"><div class="al-timeout-title">ClassIntra</div><div class="al-timeout-msg">加载时间较长，请尝试刷新</div><button class="al-reload-btn" onclick="location.reload(true)">刷新页面</button></div>';}}},15000);</script>
</head>
<body>
  <script>(function(){var t=localStorage.getItem('theme');if(t&&t!=='light'){document.documentElement.setAttribute('data-theme',t);document.body&&(document.body.setAttribute('data-theme',t));}})();</script>
  <div id="app">
    <div id="app-loading">
      <div class="al-inner">
        <div class="al-logo">C</div>
        <div>
          <div class="al-title">ClassIntra</div>
          <div class="al-subtitle">加载中</div>
        </div>
        <div class="al-dots"><span></span><span></span><span></span></div>
      </div>
    </div>
  </div>
  <noscript>请启用 JavaScript 以正常使用本系统</noscript>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
