<!DOCTYPE html>
<html lang="zh-CN">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <link rel="preload" as="image" href="/resources/public/brand/logo-mark-white.png">
  <link rel="preload" as="image" href="/resources/public/icons/Chat.png">
  <link rel="preload" as="image" href="/resources/public/icons/Community.png">
  <link rel="preload" as="image" href="/resources/public/icons/AI-Chat.png">
  <link rel="preload" as="image" href="/resources/public/icons/Note.png">
  <link rel="preload" as="image" href="/resources/public/icons/Files.png">
  <link rel="preload" as="image" href="/resources/public/icons/Weather.png">
  <link rel="preload" as="image" href="/resources/public/icons/Music.png">
  <link rel="preload" as="image" href="/resources/public/icons/Settings.png">
  <title>ClassIntra</title>
  <style>
    /* ============================================================
       系统启动动画（内联样式，首屏零依赖）
       编排：纯黑底 → 标识浮现（白色，柔和呼吸辉光）
             → 品牌字标收拢 → 副标题 → 进度条流光 → 就绪淡出
       Chrome 80 基线：不使用 gap / inset / :is() / aspect-ratio
       ============================================================ */
    #app-loading {
      position: fixed;
      top: 0;
      right: 0;
      bottom: 0;
      left: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      background: #000;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'PingFang SC', 'Noto Sans CJK SC', 'Helvetica Neue', 'Microsoft YaHei', sans-serif;
      text-align: center;
      z-index: 20000;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      -webkit-tap-highlight-color: transparent;
      opacity: 1;
      transition: opacity 0.55s cubic-bezier(0.4, 0, 0.2, 1);
    }
    #app-loading.al-done {
      opacity: 0;
      pointer-events: none;
    }

    /* 星点：极细的静态点缀，营造「系统空间」纵深 */
    #app-loading .al-stars {
      position: absolute;
      top: 0;
      right: 0;
      bottom: 0;
      left: 0;
      pointer-events: none;
      background-image:
        radial-gradient(1.5px 1.5px at 18% 26%, rgba(255, 255, 255, 0.34), transparent 100%),
        radial-gradient(1.2px 1.2px at 76% 18%, rgba(255, 255, 255, 0.26), transparent 100%),
        radial-gradient(1.6px 1.6px at 84% 66%, rgba(255, 255, 255, 0.2), transparent 100%),
        radial-gradient(1.2px 1.2px at 30% 76%, rgba(255, 255, 255, 0.17), transparent 100%),
        radial-gradient(1.4px 1.4px at 62% 88%, rgba(255, 255, 255, 0.14), transparent 100%);
      opacity: 0;
      animation: al-stars-in 1.6s ease 0.35s forwards;
    }
    @keyframes al-stars-in {
      to { opacity: 1; }
    }

    /* 舞台：就绪时整体上浮 + 淡出 */
    #app-loading .al-stage {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      transform: translateY(0) scale(1);
      opacity: 1;
      transition: transform 0.55s cubic-bezier(0.22, 0.61, 0.36, 1), opacity 0.4s ease;
      will-change: transform, opacity;
    }
    #app-loading.al-done .al-stage {
      transform: translateY(-18px) scale(1.02);
      opacity: 0;
    }

    /* 标识：从微缩中浮现（纯白） */
    #app-loading .al-mark-wrap {
      position: relative;
      width: 156px;
      height: 124px;
    }
    #app-loading .al-mark {
      position: relative;
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
      z-index: 1;
      animation: al-mark-in 1.05s cubic-bezier(0.22, 0.61, 0.36, 1) 0.12s both;
    }
    @keyframes al-mark-in {
      0% { opacity: 0; transform: scale(0.9); }
      55% { opacity: 1; }
      100% { opacity: 1; transform: scale(1); }
    }
    /* 辉光：标识的模糊副本垫底，呼吸式明暗（只动 opacity，静帧光栅一次） */
    #app-loading .al-mark-glow {
      position: absolute;
      top: 0;
      right: 0;
      bottom: 0;
      left: 0;
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
      -webkit-filter: blur(17px);
      filter: blur(17px);
      opacity: 0.3;
      pointer-events: none;
      will-change: opacity;
      animation: al-glow 3.6s ease-in-out 1s infinite;
    }
    @keyframes al-glow {
      0%, 100% { opacity: 0.24; }
      50% { opacity: 0.62; }
    }

    /* 品牌字标：字距由松到紧（聚焦感） */
    #app-loading .al-brand {
      margin-top: 26px;
      font-size: 27px;
      font-weight: 600;
      line-height: 1.2;
      letter-spacing: 0.6px;
      color: rgba(255, 255, 255, 0.96);
      animation: al-brand-in 0.9s cubic-bezier(0.22, 0.61, 0.36, 1) 0.52s both;
    }
    @keyframes al-brand-in {
      0% { opacity: 0; letter-spacing: 7px; transform: translateY(7px); }
      55% { opacity: 1; }
      100% { opacity: 1; letter-spacing: 0.6px; transform: translateY(0); }
    }

    /* 副标题 */
    #app-loading .al-tagline {
      margin-top: 9px;
      font-size: 13px;
      font-weight: 400;
      letter-spacing: 3.5px;
      text-indent: 3.5px;
      color: rgba(255, 255, 255, 0.42);
      animation: al-rise 0.8s ease 0.74s both;
    }

    /* 进度条：手机开机式的确定进度——启动后缓动填充到 76%，
       Vue 就绪后（al-complete）冲到 100% 再整体淡出，模拟真实 boot 节奏 */
    #app-loading .al-progress {
      position: relative;
      width: 168px;
      height: 4px;
      margin-top: 36px;
      border-radius: 2px;
      background: rgba(255, 255, 255, 0.14);
      overflow: hidden;
      animation: al-rise 0.7s ease 0.95s both;
    }
    #app-loading .al-progress-bar {
      position: absolute;
      top: 0;
      left: 0;
      width: 0%;
      height: 100%;
      border-radius: 2px;
      background: #ffffff;
      box-shadow: 0 0 10px rgba(255, 255, 255, 0.55);
      /* 启动填充：长缓动（2.4s 到 76%），减速曲线模拟「越接近越慢」 */
      transition: width 2.4s cubic-bezier(0.22, 0.61, 0.36, 1);
      will-change: width;
    }
    #app-loading.al-boot .al-progress-bar {
      width: 76%;
    }
    /* 就绪：短促冲线 */
    #app-loading.al-complete .al-progress-bar {
      width: 100%;
      transition: width 0.35s cubic-bezier(0.22, 0.61, 0.36, 1);
    }

    @keyframes al-rise {
      0% { opacity: 0; transform: translateY(8px); }
      100% { opacity: 1; transform: translateY(0); }
    }

    /* ---------- 加载超时（长时间未就绪） ---------- */
    #app-loading .al-timeout-inner {
      display: none;
      flex-direction: column;
      align-items: center;
      position: relative;
      z-index: 2;
      animation: al-rise 0.5s ease both;
    }
    #app-loading .al-timeout-inner > * + * { margin-top: 14px; }
    #app-loading.al-timeout .al-stage { display: none; }
    #app-loading.al-timeout .al-timeout-inner { display: flex; }
    #app-loading .al-timeout-mark { width: 86px; height: 68px; opacity: 0.92; }
    #app-loading .al-timeout-title { font-size: 19px; font-weight: 600; color: rgba(255, 255, 255, 0.95); }
    #app-loading .al-timeout-msg { font-size: 13px; color: rgba(255, 255, 255, 0.55); }
    #app-loading .al-timeout-error { font-size: 12px; color: rgba(255, 138, 128, 0.85); max-width: 320px; word-break: break-all; }
    #app-loading .al-reload-btn {
      margin-top: 6px;
      padding: 11px 30px;
      border: 1px solid rgba(255, 255, 255, 0.22);
      background: rgba(255, 255, 255, 0.07);
      color: #fff;
      border-radius: 12px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 500;
      font-family: inherit;
      -webkit-tap-highlight-color: transparent;
      transition: background 0.2s ease, border-color 0.2s ease, transform 0.15s ease;
    }
    #app-loading .al-reload-btn:hover { background: rgba(255, 255, 255, 0.13); border-color: rgba(255, 255, 255, 0.4); }
    #app-loading .al-reload-btn:active { transform: scale(0.96); }

    /* 减弱动画：保留静态呈现，去掉运动 */
    @media (prefers-reduced-motion: reduce) {
      #app-loading .al-mark-glow,
      #app-loading .al-mark,
      #app-loading .al-brand,
      #app-loading .al-tagline,
      #app-loading .al-progress,
      #app-loading .al-stars {
        animation: none !important;
        opacity: 1 !important;
      }
      #app-loading .al-mark-glow { opacity: 0.4 !important; }
      #app-loading .al-progress-bar { transition: none !important; width: 76% !important; }
      #app-loading .al-stage { transition: none !important; }
    }
  </style>

</head>

  <script>(function(){var t=localStorage.getItem('theme')||'dark';if(t!=='light'){document.documentElement.setAttribute('data-theme',t);document.body&&(document.body.setAttribute('data-theme',t));}})();</script>
  <!-- 系统启动动画：Vue 就绪后由 __onVueReady 冲线（al-complete）再淡出移除
       标识用品牌白标位图（Resources/public/brand/logo-mark-white.png），纯白 + 透明底（横向 ≈1.25:1） -->
  <div id="app-loading">
    <div class="al-stars" aria-hidden="true"></div>
    <div class="al-stage">
      <div class="al-mark-wrap">
        <img class="al-mark-glow" src="/resources/public/brand/logo-mark-white.png" alt="" aria-hidden="true">
        <img class="al-mark" src="/resources/public/brand/logo-mark-white.png" alt="ClassIntra">
      </div>
      <div class="al-brand">ClassIntra</div>
      <div class="al-tagline">智慧校园平台</div>
      <div class="al-progress" role="progressbar" aria-label="正在启动">
        <div class="al-progress-bar"></div>
      </div>
    </div>
  </div>
  <script>(function(){var el=document.getElementById('app-loading');if(!el)return;(window.requestAnimationFrame||function(f){setTimeout(f,16)})(function(){el.classList.add('al-boot');});})();</script>
  <div id="app"></div>
