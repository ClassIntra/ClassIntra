<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <!-- 白色托盘：上纯白、下极淡冷调，避免在浅色壁纸上"糊"成一片 -->
    <linearGradient id="clussTray" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#edf3ff"/>
    </linearGradient>

    <!-- 品牌玻璃切片：取 Cluss_logo.svg 的「浅色模式」原稿色（#C7D2FE / #DDD6FE / #BAE6FD），
         不透明度提到 1 —— 原稿的 0.8x 是叠在深色底上的，叠在白底上会二次变淡 -->
    <linearGradient id="glass1" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#C7D2FE" stop-opacity="1"/>
      <stop offset="100%" stop-color="#E0E7FF" stop-opacity="1"/>
    </linearGradient>
    <linearGradient id="glass2" x1="100" y1="50" x2="400" y2="450" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#DDD6FE" stop-opacity="1"/>
      <stop offset="100%" stop-color="#F3E8FF" stop-opacity="1"/>
    </linearGradient>
    <linearGradient id="glass3" x1="150" y1="450" x2="450" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#BAE6FD" stop-opacity="1"/>
      <stop offset="100%" stop-color="#E0F2FE" stop-opacity="1"/>
    </linearGradient>

    <!-- 玻璃卡片投影：白底上做很轻的悬浮，别让白卡内部发脏 -->
    <filter id="soft-shadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#818CF8" flood-opacity="0.26"/>
    </filter>
  </defs>

  <!-- 圆角白底（满幅 0~1024，与 CI 其它白卡图标同尺寸网格） -->
  <rect x="0" y="0" width="1024" height="1024" rx="252" fill="url(#clussTray)"/>
  <!-- 托盘描边：让白底在浅色壁纸上仍有边界（内缩 3px 避免被画布裁切） -->
  <rect x="3" y="3" width="1018" height="1018" rx="249" fill="none"
        stroke="#0f172a" stroke-opacity="0.10" stroke-width="6"/>

  <!-- Cluss_logo.svg 原稿（512）等比放大到 1024 画布内 -->
  <g transform="translate(512 512) scale(2.05) translate(-256 -256)">
    <g filter="url(#soft-shadow)">
      <rect x="106" y="106" width="300" height="300" rx="72" fill="url(#glass1)" stroke="#6366F1" stroke-opacity="0.14" stroke-width="3" transform="rotate(-15 256 256)"/>
      <rect x="106" y="106" width="300" height="300" rx="72" fill="url(#glass2)" stroke="#6366F1" stroke-opacity="0.14" stroke-width="3" transform="rotate(15 256 256)"/>
      <rect x="136" y="136" width="240" height="240" rx="60" fill="url(#glass3)" stroke="#6366F1" stroke-opacity="0.14" stroke-width="3" transform="rotate(45 256 256)"/>
    </g>
    <path d="M 256 200
             Q 268 244 312 256
             Q 268 268 256 312
             Q 244 268 200 256
             Q 244 244 256 200 Z"
          fill="#FFFFFF"/>
  </g>
</svg>
