<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>ZXW</title>
<style>
:root{--bg:#0b0e14;--fg:#e8eaf0;--fg2:rgba(232,234,240,.55);--fg3:rgba(232,234,240,.28);--s1:rgba(255,255,255,.06);--s2:rgba(255,255,255,.1);--accent:#8ab4f8;--ok:#81c995;--err:#f28b82;--card:rgba(20,24,34,.9);--border:rgba(255,255,255,.08)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font:14px/1.6 -apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif;background:var(--bg);color:var(--fg);padding:20px 16px 40px;-webkit-user-select:none;user-select:none}
h1{font-size:18px;font-weight:600;margin-bottom:2px}
.sub{font-size:11px;color:var(--fg3);margin-bottom:14px}
#st{padding:14px;border-radius:12px;background:var(--card);border:1px solid var(--border);font-size:14px;font-weight:500;min-height:52px;display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center}
#st.ok{color:var(--ok)}
#st.err{color:var(--err)}
#st.busy{color:var(--accent)}
.row{display:-webkit-flex;display:flex;gap:8px;margin-top:10px}
button{-webkit-flex:1;flex:1;font:inherit;padding:12px;border:0;border-radius:10px;background:var(--accent);color:#0b0e14;font-weight:600;cursor:pointer;-webkit-appearance:none;appearance:none}
button.alt{background:var(--s2);color:var(--fg);font-weight:500}
button.ghost{background:transparent;color:var(--fg3);font-weight:500;font-size:12px;padding:8px}
button:active{opacity:.8}
#adv.hidden{display:none}
.fields{margin-top:14px;padding:12px;border-radius:12px;background:var(--card);border:1px solid var(--border)}
.fields label{display:block;font-size:11px;color:var(--fg3);margin-top:8px}
.fields label:first-child{margin-top:0}
.fields input{width:100%;font:13px/1.4 inherit;padding:8px 10px;margin-top:3px;border-radius:8px;border:1px solid var(--border);background:var(--s1);color:var(--fg);outline:none}
.fields input:focus{border-color:var(--accent)}
.drv{font-size:11px;color:var(--fg3);margin-top:8px;word-break:break-all}
#log{margin-top:14px;padding:12px;border-radius:12px;background:var(--card);border:1px solid var(--border);font:11px/1.5 Consolas,monospace;color:var(--fg2);white-space:pre-wrap;word-break:break-all;min-height:60px;max-height:220px;overflow-y:auto}
.links{margin-top:10px;font-size:12px}
.links a{color:var(--accent);text-decoration:none;margin-right:14px}
.badge{display:inline-block;font-size:10px;padding:2px 8px;border-radius:8px;background:var(--s2);color:var(--fg2);margin-left:6px}
</style>
</head>
